name: Setup test env
description: CI 테스트용 DB/JWT 환경변수 설정
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "DB_HOST=localhost" >> "$GITHUB_ENV"
        echo "DB_PORT=5432" >> "$GITHUB_ENV"
        echo "DB_NAME=testdb" >> "$GITHUB_ENV"
        echo "DB_USERNAME=test" >> "$GITHUB_ENV"
        echo "DB_PASSWORD=test1234" >> "$GITHUB_ENV"
        echo "AUTH_DB_SCHEMA=public" >> "$GITHUB_ENV"
        echo "JWT_SECRET=test-jwt-secret-for-ci-only-please-ignore" >> "$GITHUB_ENV"
        echo "JWT_ACCESSTOKEN_EXPIRATION_MS=100000" >> "$GITHUB_ENV"
        echo "JWT_REFRESHTOKEN_EXPIRATION_MS=200000000" >> "$GITHUB_ENV"
        
        echo "REDIS_HOST=localhost" >> "$GITHUB_ENV"
        echo "REDIS_PORT=6379" >> "$GITHUB_ENV"
        echo "REDIS_PASSWORD=" >> "$GITHUB_ENV"
        echo "REDIS_DATABASE=310" >> "$GITHUB_ENV"
        
        echo "MAIL_USERNAME=test@naver.com" >> "$GITHUB_ENV"
        echo "MAIL_PASSWORD=testpassword" >> "$GITHUB_ENV"
        
        # MinIO
        echo "MINIO_URL=http://localhost:9000" >> "$GITHUB_ENV"
        echo "MINIO_ACCESS_KEY=minioadmin" >> "$GITHUB_ENV"
        echo "MINIO_SECRET_KEY=minioadmin123" >> "$GITHUB_ENV"
        echo "MINIO_BUCKET=testbucket" >> "$GITHUB_ENV"
        echo "MINIO_PUBLIC_BASE_URL=https://yes-nhn.site/storage-proxy" >> "$GITHUB_ENV"
        
        # Client
        echo "CULTIVATION_SERVER_URL=http://localhost:8084" >> "$GITHUB_ENV"
        
        # Google
        echo "GOOGLE_CLIENT_ID=ci-google-client-id" >> "$GITHUB_ENV"
        echo "GOOGLE_SECRET=ci-google-client-secret" >> "$GITHUB_ENV"
